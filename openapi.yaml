openapi: 3.0.3
info:
  title: API Everything - core gateway
  version: 0.3.0
  description: >
    Two different credentials. A 16-digit unlock code opens an account
    (X-Unlock-Code); it is NEVER an API key. Inside the account you create,
    rotate and revoke API keys (`ae_` + 48 hex) which are the only credentials
    accepted in X-API-Key. Credits belong to the account, so rotating a key
    never costs a credit. Only hashes, credit counters and timestamps are
    stored: no IP, no email, no wallet, no query history, no request log.
    Includes a privacy-first SHA-256 RAM cache with in-flight request
    coalescing and a zero-identity PayAsYouGo payment-to-voucher bridge.
  license:
    name: MIT
servers:
  - url: http://localhost:9000
    description: Local gateway
paths:
  /health:
    get:
      summary: Gateway health, account/key counters, cache stats and connector list
      responses:
        "200": { description: OK }
  /:
    get:
      summary: Gateway description and endpoint index
      responses:
        "200": { description: OK }
  /v1/openapi.json:
    get:
      summary: Unified OpenAPI 3.0.3 JSON specification (gateway + discovered connectors)
      description: >
        Merges gateway routes with `/v1/{service}/*` paths discovered from each
        configured upstream's `/openapi.yaml` (cached 60s in memory). Falls back
        gracefully when upstreams are offline.
      responses:
        "200": { description: OpenAPI 3.0.3 JSON document }
  /v1/status:
    get:
      summary: Public health of every configured connector
      description: Returns service names, availability and latency. Internal upstream URLs are never exposed.
      responses:
        "200": { description: Connector status }
  /v1/signup:
    post:
      summary: Create an account with no identity (returns the 16-digit unlock code ONCE)
      description: >
        Public, identity-free account creation. Returns a 16-digit UNLOCK CODE
        with a small starter balance and no expiry — no email, no subscription,
        no monthly reset. The code opens the account via X-Unlock-Code; it is
        NOT an API key. The gateway stores only its SHA-256 hash. Rate-limited
        by a transient in-memory hash of the client address, never persisted.
      responses:
        "201":
          description: Created. Save the unlock code now; it cannot be recovered.
        "429": { description: RATE_LIMITED }
  /v1/unlock:
    post:
      summary: Open an existing account with its 16-digit unlock code
      security: [{ UnlockCode: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                unlockCode: { type: string, pattern: "^[0-9]{16}$" }
      responses:
        "200": { description: Account summary and active API key count }
        "401": { description: INVALID_UNLOCK_CODE }
  /v1/keys:
    get:
      summary: List this account's API keys (sanitized, no raw keys)
      security: [{ UnlockCode: [] }]
      responses:
        "200": { description: Keys }
        "401": { description: INVALID_UNLOCK_CODE }
    post:
      summary: Create a new API key. The raw `ae_` key is returned ONCE.
      security: [{ UnlockCode: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 40, default: default }
      responses:
        "201": { description: Created }
        "409": { description: TOO_MANY_KEYS }
  /v1/keys/reset:
    post:
      summary: Reset ALL API keys — revoke every active key, issue a fresh one
      security: [{ UnlockCode: [] }]
      responses:
        "201": { description: New API key }
  /v1/keys/{keyId}:
    delete:
      summary: Revoke one API key
      security: [{ UnlockCode: [] }]
      parameters:
        - in: path
          name: keyId
          required: true
          description: SHA-256 hash of the API key (returned as keyId by GET /v1/keys)
          schema: { type: string, pattern: "^[a-f0-9]{64}$" }
      responses:
        "200": { description: Revoked }
        "404": { description: KEY_NOT_FOUND }
  /v1/keys/{keyId}/reset:
    post:
      summary: Rotate one API key — revoke it and issue a replacement
      security: [{ UnlockCode: [] }]
      parameters:
        - in: path
          name: keyId
          required: true
          schema: { type: string, pattern: "^[a-f0-9]{64}$" }
      responses:
        "201": { description: New API key }
        "404": { description: KEY_NOT_FOUND }
  /v1/usage:
    get:
      summary: Credits, expiry, API key count and rate-limit remaining for the account
      description: Accepts either X-API-Key (preferred) or X-Unlock-Code.
      security: [{ ApiKey: [] }, { UnlockCode: [] }]
      responses:
        "200": { description: Usage }
        "401": { description: INVALID_KEY / UNLOCK_CODE_NOT_API_KEY / INVALID_UNLOCK_CODE }
  /v1/redeem:
    post:
      summary: Redeem a one-time voucher for credits (no identity required)
      description: >
        Credits an account addressed by `unlockCode`, `apiKey`, or a
        client-generated `accountHash` (only when CORE_ALLOW_CLIENT_HASH=1).
        If none is provided a fresh account and unlock code are created and
        returned once. `key` is a deprecated alias for the 16-digit unlock code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
                unlockCode: { type: string, pattern: "^[0-9]{16}$" }
                apiKey: { type: string, pattern: "^ae_[a-f0-9]{48}$" }
                accountHash: { type: string, pattern: "^[a-f0-9]{64}$" }
      responses:
        "200": { description: Redeemed }
        "400": { description: BAD_VOUCHER / BAD_KEYHASH }
        "403": { description: CLIENT_HASH_DISABLED }
  /v1/payments/packs:
    get:
      summary: List PayAsYouGo credit packs and payment bridge mode
      description: >
        Public, zero-identity endpoint returning `enabled`, `mode` (`disabled`,
        `sandbox`, or `btcpay`), `currency`, `model: "pay_as_you_go"`, and
        available credit packs.
      responses:
        "200": { description: Credit packs }
  /v1/payments/checkout:
    post:
      summary: Create a zero-identity PayAsYouGo invoice for a credit pack
      description: >
        Creates a transient in-memory invoice (1h TTL, never stored in keys.json,
        never linked to an accountHash). Once settled, the invoice yields a
        one-time bearer voucher redeemable via POST /v1/redeem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [packId]
              properties:
                packId: { type: string, example: pack_1k }
      responses:
        "201": { description: Pending invoice }
        "400": { description: BAD_PACK }
        "502": { description: PAYMENT_UPSTREAM_ERROR }
        "503": { description: PAYMENTS_DISABLED }
  /v1/payments/invoices/{invoiceId}:
    get:
      summary: Poll transient invoice status and claim settled voucherCode
      parameters:
        - in: path
          name: invoiceId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Invoice status and one-time voucherCode when settled }
        "404": { description: INVOICE_NOT_FOUND }
  /v1/payments/sandbox/{invoiceId}/settle:
    post:
      summary: Settle a local sandbox invoice and mint its one-time voucher
      description: Available ONLY when CORE_PAYMENT_SANDBOX=1; returns 403 SANDBOX_DISABLED otherwise.
      parameters:
        - in: path
          name: invoiceId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Settled invoice with minted voucherCode }
        "403": { description: SANDBOX_DISABLED }
        "404": { description: INVOICE_NOT_FOUND }
  /v1/payments/webhook:
    post:
      summary: Signed BTCPay webhook (HMAC-SHA256 verification on raw request bytes)
      description: >
        Fail-closed (`503 WEBHOOK_DISABLED`) unless CORE_WEBHOOK_SECRET is set.
        Verifies `btcpay-sig` (`sha256=<hex>`) over exact raw bytes with
        timingSafeEqual and idempotently mints a one-time voucher on settlement.
      parameters:
        - in: header
          name: btcpay-sig
          required: true
          schema: { type: string }
      responses:
        "200": { description: Webhook processed }
        "401": { description: INVALID_SIGNATURE }
        "503": { description: WEBHOOK_DISABLED }
  /v1/vouchers:
    post:
      summary: Issue a one-time credit voucher (admin)
      security: [{ AdminToken: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                credits: { type: integer, default: 5000 }
                expiresInDays: { type: integer, default: 365 }
      responses:
        "201": { description: Created }
  /v1/admin/accounts:
    get:
      summary: List accounts (admin, hashes and counters only)
      security: [{ AdminToken: [] }]
      responses:
        "200": { description: Accounts }
    post:
      summary: Create an account with a custom balance (admin)
      security: [{ AdminToken: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                credits: { type: integer, default: 5000 }
                expiresInDays: { type: integer, nullable: true, default: null }
      responses:
        "201": { description: Created. Unlock code returned once }
  /v1/admin/accounts/{accountHash}:
    delete:
      summary: Revoke an account and all its API keys (admin)
      security: [{ AdminToken: [] }]
      parameters:
        - in: path
          name: accountHash
          required: true
          schema: { type: string, pattern: "^[a-f0-9]{64}$" }
      responses:
        "200": { description: Revoked }
  /v1/admin/accounts/{accountHash}/topup:
    post:
      summary: Add credits to an account (admin)
      security: [{ AdminToken: [] }]
      parameters:
        - in: path
          name: accountHash
          required: true
          schema: { type: string, pattern: "^[a-f0-9]{64}$" }
      responses:
        "200": { description: Updated }
  /v1/{service}/{path}:
    get:
      summary: Proxy a connector request, debiting weighted credits on success
      description: >
        Requires an `ae_` API key in X-API-Key. Sending the 16-digit unlock code
        here returns 401 UNLOCK_CODE_NOT_API_KEY with a hint to create an API key.
        GET and HEAD billable responses are cached in RAM under a SHA-256 key hash
        and concurrent misses coalesce into a single upstream request.
      security: [{ ApiKey: [] }]
      parameters:
        - in: path
          name: service
          required: true
          schema: { type: string, enum: [instagram, youtube, linkedin, tiktok] }
        - in: path
          name: path
          required: true
          schema: { type: string }
        - in: header
          name: Cache-Control
          required: false
          description: Pass `no-cache` or `no-store` to bypass reading the gateway RAM cache (`X-Cache: BYPASS`).
          schema: { type: string }
      responses:
        "200":
          description: Upstream response, with X-Credits-* and X-Cache headers
          headers:
            X-Credits-Cost:
              description: Weighted credit cost for this route
              schema: { type: integer }
            X-Credits-Remaining:
              description: Account credits remaining
              schema: { type: integer }
            X-RateLimit-Remaining:
              description: Per-account requests remaining in the 60s window
              schema: { type: integer }
            X-Charged:
              description: Whether the request was debited
              schema: { type: string, enum: ["true", "false"] }
            X-Cache:
              description: Gateway cache state (HIT, MISS, COALESCED, BYPASS)
              schema: { type: string, enum: [HIT, MISS, COALESCED, BYPASS] }
        "401": { description: INVALID_KEY / UNLOCK_CODE_NOT_API_KEY / KEY_REVOKED }
        "402": { description: NO_CREDITS }
        "403": { description: ROUTE_BLOCKED / ACCOUNT_REVOKED }
        "429": { description: RATE_LIMITED }
        "502": { description: UPSTREAM_UNAVAILABLE }
components:
  securitySchemes:
    UnlockCode:
      type: apiKey
      in: header
      name: X-Unlock-Code
      description: 16-digit code that OPENS the account. Never used for API calls.
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Rotatable `ae_` API key created inside the account.
    AdminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
